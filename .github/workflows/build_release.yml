name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-android:
    name: Build for Android (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: aarch64-linux-android
            arch: arm64-v8a
          - target: armv7-linux-androideabi
            arch: armeabi-v7a
          - target: i686-linux-android
            arch: x86
          - target: x86_64-linux-android
            arch: x86_64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25c
          add-to-path: true

      - name: Install FUSE headers
        # usud links libfuse; the NDK provides the sysroot headers itself, but
        # the host build of any build script needs pkg-config.
        run: sudo apt-get update && sudo apt-get install -y pkg-config

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build usud and usud-init
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cargo ndk -t ${{ matrix.arch }} build --release --bin usud --bin usud-init

      - name: Package binaries
        run: |
          set -eu
          mkdir -p dist/${{ matrix.arch }}
          cp target/${{ matrix.target }}/release/usud dist/${{ matrix.arch }}/
          cp target/${{ matrix.target }}/release/usud-init dist/${{ matrix.arch }}/
          # The documented su entry point is a symlink to usud, not a copy.
          ln -sf usud dist/${{ matrix.arch }}/su

          $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip \
            dist/${{ matrix.arch }}/usud dist/${{ matrix.arch }}/usud-init

          cd dist
          tar -czhf usersu-${{ matrix.arch }}.tar.gz ${{ matrix.arch }}/
          cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: usersu-${{ matrix.arch }}
          path: dist/usersu-${{ matrix.arch }}.tar.gz

  create-release:
    name: Create Release
    needs: build-android
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create checksums
        run: |
          cd artifacts
          for dir in */; do
            cd "$dir"
            sha256sum *.tar.gz > checksums.txt
            cd ..
          done

      - name: Generate release notes
        run: |
          cat > release_notes.md << 'EOF'
          ## UserSU Release ${{ github.ref_name }}

          A userspace root environment for Android.

          ### Binaries included
          - `usud` — the backend daemon and `su`
          - `usud-init` — the sandboxed PID 1
          - `su` — a symlink to `usud`

          ### Supported architectures
          - arm64-v8a (aarch64)
          - armeabi-v7a (armv7)
          - x86_64
          - x86

          ### Installation
          1. Download the archive for your device architecture
          2. Extract: `tar -xzf usersu-<arch>.tar.gz`
          3. Push: `adb push <arch>/usud /data/local/tmp/`
          4. Run: `adb shell /data/local/tmp/usud install`

          ### Verification
          ```sh
          sha256sum -c checksums.txt
          ```
          EOF

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          body_path: release_notes.md
          files: |
            artifacts/usersu-arm64-v8a/usersu-arm64-v8a.tar.gz
            artifacts/usersu-arm64-v8a/checksums.txt
            artifacts/usersu-armeabi-v7a/usersu-armeabi-v7a.tar.gz
            artifacts/usersu-armeabi-v7a/checksums.txt
            artifacts/usersu-x86_64/usersu-x86_64.tar.gz
            artifacts/usersu-x86_64/checksums.txt
            artifacts/usersu-x86/usersu-x86.tar.gz
            artifacts/usersu-x86/checksums.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-info:
    name: Build Information
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate build info
        run: |
          {
            echo "### Build Information"
            echo ""
            echo "- **Commit:** ${{ github.sha }}"
            echo "- **Ref:** ${{ github.ref }}"
            echo "- **Author:** ${{ github.actor }}"
            echo "- **Rust Version:** stable"
            echo "- **NDK Version:** r25c"
          } >> $GITHUB_STEP_SUMMARY
