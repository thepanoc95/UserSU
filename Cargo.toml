[workspace]
resolver = "2"
members = [
    "usersu-core",
    "usud",
    "usud-init",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Unlicense"
authors = ["UserSU contributors"]
repository = "https://github.com/thepanoc95/UserSU"

[workspace.dependencies]
usersu-core = { path = "usersu-core" }

anyhow = "1.0"
bincode = "1.3"
clap = { version = "4.5", features = ["derive"] }
env_logger = "0.11"
libc = "0.2"
log = "0.4"
nix = { version = "0.29", features = [
    "fs",
    "mount",
    "process",
    "signal",
    "ptrace",
    "user",
    "sched",
    "hostname",
    "term",
    "reboot",
    "poll",
    "socket",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
toml = "0.8"
fuser = { version = "0.14", default-features = false, features = ["libfuse"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
